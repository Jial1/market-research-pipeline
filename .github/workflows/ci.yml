name: Offline verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://portfolio:portfolio@127.0.0.1:5432/portfolio?sslmode=disable
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: npm ci
      - run: python -m pip install -r python/requirements.txt
      - run: npm start
      - run: npm run evaluate:demo
      - run: npm test
      - run: npm run test:python
      - run: npm run test:integration
      - run: npm run check:release
      - name: Confirm demo stays outside published source
        run: |
          test -f local-data/demo/report.html
          test "$(find local-data/demo -type f | wc -l)" -eq 1
          git diff --exit-code -- examples fixtures
          test -z "$(git ls-files --others --exclude-standard -- examples)"
